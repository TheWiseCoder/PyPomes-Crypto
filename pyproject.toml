[build-system]
requires = [
    "hatchling>=1.32.4"
]
build-backend = "hatchling.build"

[project]
name = "pypomes_crypto"
version = "0.8.8"
authors = [
  { name="GT Nunes", email="wisecoder01@gmail.com" }
]
description = "A collection of Python pomes, penyeach (cryptography modules)"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "argon2-cffi>=25.1.0",
    "asn1crypto>=1.5.1",
    "cryptography>=50.0.2",
    "passlib>=1.7.4",
    "pycryptodome>=4.0.0",
    "pyHanko>=0.37.0",
    "PyJWT>=2.15.1",
	"PyPDF2>=3.0.1",
    "pypomes_core>=3.3.2",
    "requests>=2.34.2"
]

[project.urls]
"Homepage" = "https://github.com/TheWiseCoder/PyPomes-Crypto"
"Bug Tracker" = "https://github.com/TheWiseCoder/PyPomes-Crypto/issues"
